<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse;
            padding: 10px;
        }

        th{
            border: 1px solid black;
            padding: 5px;
        }

        td{
            border: 1px solid black;
            padding: 10px;
        }

        .class1{
            text-align: left;
            background-color: gray;
            color: white;
        }

        .class2{
            background-color: gray;
            color: white;
        }

        thead{
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <caption>
          Desafio de tabela de exatas e humanas
        </caption>
        <thead>
            
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="class1" scope="row">Média de exatas</th>
                <td class="class2">0.0</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="class1" scope="row">Média de humanas</th>
                <td class="class2">0.0</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
